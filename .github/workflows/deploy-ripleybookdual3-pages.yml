name: Deploy RipleyBookDual v3.0.1 Full Web Flasher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ripleybookdual3-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ripleybookdual3-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout flasher repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and verify hardware-tested v3.0.1 Full Factory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p docs/firmware
          url="https://github.com/2d-ripley/RipleyBook-DualS3-Flasher/releases/download/v3.0.1/RipleyBookDual3.0.1-Full-Factory.bin"
          curl --fail --location --retry 3 --silent --show-error "$url" -o docs/firmware/RipleyBookDual3.0.1-Full-Factory.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("docs/firmware/RipleyBookDual3.0.1-Full-Factory.bin")
          b=p.read_bytes()
          expected="f320ffb554f085fc355dee072b5b5af63b892790cd45d594372f87d276281d9f"
          assert len(b)==6375648, "Wrong v3.0.1 factory image size"
          assert hashlib.sha256(b).hexdigest()==expected, "Wrong v3.0.1 factory SHA-256"
          assert b[0]==0xe9 and b[12]==9, "Wrong bootloader header"
          assert b[0x8000:0x8002]==bytes.fromhex("aa50"), "Wrong partition table"
          assert b[0x10000]==0xe9 and b[0x1000c]==9, "Wrong app header"
          assert b[0xe000:0x10000]==bytes([255])*0x2000, "Unexpected OTA gap"
          apphash=hashlib.sha256(b[0x10000:]).hexdigest()
          print("Verified v3.0.1 Factory:",len(b),expected,"app:",apphash)
          f=Path("docs/index.html")
          s=f.read_text(encoding="utf-8")
          def replace_once(old,new):
              global s
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new,1)
          replace_once('factorySize: 0, // set ONLY after 0x0 factory hardware boot acceptance',
                       'factorySize: 6375648, // v3.0.1 verified hardware-tested Factory')
          replace_once('applicationSHA256: "",',f'applicationSHA256: "{apphash}",')
          replace_once('factorySHA256: "" // keep Install disabled until exact 0x0 Factory boot test passes',
                       'factorySHA256: "'+expected+'" // pinned v3.0.1 Factory SHA-256')
          replace_once('file: "RipleyBookDual3.0-Full-Factory.bin"',
                       'file: "RipleyBookDual3.0.1-Full-Factory.bin"')
          replace_once('version: "3.0 Full"','version: "3.0.1 Full"')
          replace_once('name:"RipleyBookDual 3.0 Full"','name:"RipleyBookDual 3.0.1 Full"')
          replace_once('<title>RipleyBookDual · Parallel 3.0 Flasher</title>',
                       '<title>RipleyBookDual · v3.0.1 Flasher</title>')
          replace_once('<span class="brand">RIPLEYBOOKDUAL 3.0 / PAPER S3</span>',
                       '<span class="brand">RIPLEYBOOKDUAL 3.0.1 / PAPER S3</span>')
          replace_once('<span class="version">3.0 Full</span>',
                       '<span class="version">3.0.1 Full</span>')
          replace_once('RipleyBookDual 3.0，兩台 Paper S3',
                       'RipleyBookDual 3.0.1，兩台 Paper S3')
          replace_once('zh:{lead:"RipleyBookDual 3.0，兩台 Paper S3',
                       'zh:{lead:"RipleyBookDual 3.0.1，兩台 Paper S3')
          replace_once('en:{lead:"RipleyBookDual 3.0: one Full firmware',
                       'en:{lead:"RipleyBookDual 3.0.1: one Full firmware')
          replace_once('選 Parallel 3.0 Full，點選 Install',
                       '選 v3.0.1 Full，點選 Install')
          replace_once('step3:"選 Parallel 3.0 Full，點選 Install',
                       'step3:"選 v3.0.1 Full，點選 Install')
          replace_once('Select Parallel 3.0 Full, press Install',
                       'Select v3.0.1 Full, press Install')
          replace_once('完整教學 · 閱讀與自製 App</h2>',
                       '完整教學 · 閱讀與自製 App</h2>')
          # Show the new feature and its non-negotiable pairing rule in both languages.
          replace_once('兩台需安裝完全相同版本。完成後重啟',
                       '兩台都需安裝 v3.0.1。Spread 連線前，先在右機選 RTL／LTR；連線後兩機方向一致且不可更改。完成後重啟')
          replace_once('step4:"兩台需安裝完全相同版本。完成後重啟',
                       'step4:"兩台都需安裝 v3.0.1。Spread 連線前，先在右機選 RTL／LTR；連線後兩機方向一致且不可更改。完成後重啟')
          replace_once('Flash the same edition to both readers. Reboot',
                       'Flash v3.0.1 on both readers. For Spread, choose RTL/LTR on the RIGHT device before pairing; direction cannot change while connected. Reboot')
          replace_once('單機 ＋ Spread 即時捲角 ＋ Parallel 3.0 相對章節 ±N。',
                       '單機＋Spread＋Parallel 3.0；新增中文／日文 RTL 直排。')
          replace_once('fullDesc:"單機 ＋ Spread 即時大捲角 ＋ Parallel 3.0（原地連線／相對 ±N 跨章）。"',
                       'fullDesc:"單機＋Spread＋Parallel 3.0；新增中文／日文 RTL 直排（RTL 無大捲角）。"')
          replace_once('fullDesc:"Solo + Spread tap-first page curl + Parallel 3.0 (in-place join, relative ±N chapter jumps)."',
                       'fullDesc:"Solo + Spread + Parallel 3.0; new vertical Chinese/Japanese RTL reading (no large curl in RTL)."')
          f.write_text(s,encoding="utf-8")
          assert 'RipleyBookDual3.0.1-Full-Factory.bin' in s
          assert 'factorySize: 6375648' in s
          assert '連線後兩機方向一致且不可更改' in s
          print("Verified v3.0.1 installer configured")
          PY
          test -f docs/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified v3.0.1 static Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy HTTPS website
        id: deployment
        uses: actions/deploy-pages@v4
